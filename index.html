<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attraction Profile Estimator &amp; Training Program</title>
<meta name="description" content="A research-based attraction profile estimator and a phase-by-phase training program, grounded in mate-preference and relationship science." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #12161F; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #2A3244; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #B23A32; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #B23A32; cursor: pointer; border: none; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;


// ---- Design tokens ----
const C = {
  ink: "#12161F",
  inkSoft: "#1A2030",
  inkSofter: "#212940",
  paper: "#ECE7D8",
  paperDim: "#B9B29B",
  rust: "#B23A32",
  gold: "#C9A227",
  teal: "#4F7C82",
  line: "#2A3244",
};

const serif = "'Source Serif 4', Georgia, serif";
const mono = "ui-monospace, 'SF Mono', monospace";

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}
function cmToFtIn(cm) {
  const totalInches = cm / 2.54;
  const feet = Math.floor(totalInches / 12);
  const inches = Math.round(totalInches - feet * 12);
  if (inches === 12) return { feet: feet + 1, inches: 0 };
  return { feet, inches };
}
function ftInToCm(feet, inches) {
  return (feet * 12 + inches) * 2.54;
}
function heightScore(cm) {
  if (!cm) return 5;
  const diff = cm - 175;
  return clamp(5 + diff / 4.5, 1, 10);
}

// ---------------- Calculator data (from prior build) ----------------
const SLIDER_INITIAL = [
  { key: "confidence", label: "Social confidence (calibrated, not aggressive)", anchor: "1 = freeze up · 10 = at ease initiating" },
  { key: "fitness", label: "Physical fitness / conditioning", anchor: "1 = sedentary · 10 = visibly fit, trains consistently" },
  { key: "grooming", label: "Grooming & style presentation", anchor: "1 = no attention · 10 = dialed-in, intentional" },
  { key: "humor", label: "Humor / conversational charisma", anchor: "1 = flat · 10 = quick, playful, easy energy" },
  { key: "voice", label: "Vocal presence (tone, clarity, pace)", anchor: "1 = mumbled, rushed · 10 = clear, grounded" },
];
const SLIDER_LONGTERM = [
  { key: "trust", label: "Trustworthiness / emotional stability", anchor: "1 = volatile · 10 = steady under stress" },
  { key: "warmth", label: "Warmth / kindness toward others", anchor: "1 = self-centered · 10 = generous, kind by default" },
  { key: "communication", label: "Communication & emotional intelligence", anchor: "1 = avoids hard talks · 10 = direct, repairs conflict well" },
  { key: "ambition", label: "Ambition / clarity of direction", anchor: "1 = no direction · 10 = visibly building toward something" },
];
const SELECTS = [
  { key: "trajectory", label: "Career / income trajectory", options: [
    { v: 2, t: "Declining or unstable" }, { v: 5, t: "Stable, flat" }, { v: 7, t: "Growing steadily" }, { v: 9, t: "High growth" },
  ]},
  { key: "education", label: "Education level", options: [
    { v: 4, t: "High school" }, { v: 6, t: "Some college / trade cert." }, { v: 8, t: "Bachelor's degree" }, { v: 9, t: "Graduate / professional degree" },
  ]},
];
const W_INIT = { confidence: 0.25, fitness: 0.18, height: 0.15, humor: 0.15, grooming: 0.12, voice: 0.08, trajectorySignal: 0.07 };
const W_LONG = { trust: 0.22, warmth: 0.2, trajectory: 0.18, communication: 0.16, confidence: 0.1, education: 0.08, fitness: 0.06 };

function Gauge({ value, label, color, sub }) {
  const pct = clamp(value, 0, 10) / 10;
  const circ = 2 * Math.PI * 50;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
      <svg width="128" height="128" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="50" fill="none" stroke={C.line} strokeWidth="9" />
        <circle cx="64" cy="64" r="50" fill="none" stroke={color} strokeWidth="9"
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round"
          transform="rotate(-90 64 64)" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
        <text x="64" y="60" textAnchor="middle" fontSize="27" fontFamily={serif} fill={C.paper}>{value.toFixed(1)}</text>
        <text x="64" y="79" textAnchor="middle" fontSize="9" fill={C.paperDim}>/ 10</text>
      </svg>
      <div style={{ fontFamily: serif, fontSize: 14.5, color: C.paper, textAlign: "center" }}>{label}</div>
      <div style={{ fontSize: 10.5, color: C.paperDim, textAlign: "center", maxWidth: 150 }}>{sub}</div>
    </div>
  );
}

function Slider({ trait, value, onChange }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
        <label style={{ fontSize: 13.5, color: C.paper, fontFamily: serif }}>{trait.label}</label>
        <span style={{ fontFamily: mono, fontSize: 12.5, color: C.gold }}>{value}</span>
      </div>
      <input type="range" min="1" max="10" value={value} onChange={(e) => onChange(Number(e.target.value))}
        style={{ width: "100%", accentColor: C.rust }} />
      <div style={{ fontSize: 10, color: C.paperDim, marginTop: 2, fontStyle: "italic" }}>{trait.anchor}</div>
    </div>
  );
}

function Calculator() {
  const [unit, setUnit] = useState("imperial");
  const [heightCm, setHeightCm] = useState(178);
  const [v, setV] = useState({ confidence: 5, fitness: 5, grooming: 5, humor: 5, voice: 5, trust: 5, warmth: 5, communication: 5, ambition: 5, trajectory: 5, education: 8 });
  const upd = (k, val) => setV((s) => ({ ...s, [k]: val }));
  const h = heightScore(heightCm);

  const init = useMemo(() => clamp(
    v.confidence * W_INIT.confidence + v.fitness * W_INIT.fitness + h * W_INIT.height +
    v.humor * W_INIT.humor + v.grooming * W_INIT.grooming + v.voice * W_INIT.voice +
    v.trajectory * W_INIT.trajectorySignal, 1, 10), [v, h]);

  const long = useMemo(() => clamp(
    v.trust * W_LONG.trust + v.warmth * W_LONG.warmth + v.trajectory * W_LONG.trajectory +
    v.communication * W_LONG.communication + v.confidence * W_LONG.confidence +
    v.education * W_LONG.education + v.fitness * W_LONG.fitness, 1, 10), [v]);

  const overall = init * 0.45 + long * 0.55;

  const gaps = [
    { label: "Social confidence", val: v.confidence, w: 0.17 },
    { label: "Warmth / kindness", val: v.warmth, w: 0.2 },
    { label: "Trustworthiness / stability", val: v.trust, w: 0.22 },
    { label: "Communication", val: v.communication, w: 0.16 },
    { label: "Career trajectory", val: v.trajectory, w: 0.12 },
    { label: "Fitness", val: v.fitness, w: 0.12 },
    { label: "Grooming / style", val: v.grooming, w: 0.12 },
    { label: "Humor / charisma", val: v.humor, w: 0.15 },
  ].map((c) => ({ ...c, gap: (10 - c.val) * c.w })).sort((a, b) => b.gap - a.gap).slice(0, 3);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "center", gap: 24, flexWrap: "wrap", marginBottom: 28, padding: "20px 0", background: C.inkSoft, borderRadius: 10, border: `1px solid ${C.line}` }}>
        <Gauge value={init} label="Initial Spark" color={C.rust} sub="Confidence, presentation, humor, physicality" />
        <Gauge value={long} label="Long-Term Partner" color={C.gold} sub="Trust, warmth, trajectory, communication" />
        <Gauge value={overall} label="Blended" color={C.teal} sub="45% initial / 55% long-term" />
      </div>

      <div style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
          <label style={{ fontSize: 13.5, color: C.paper, fontFamily: serif }}>Height</label>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontFamily: mono, fontSize: 12.5, color: C.gold }}>
              {unit === "imperial" ? `${cmToFtIn(heightCm).feet}'${cmToFtIn(heightCm).inches}"` : `${Math.round(heightCm)} cm`}
            </span>
            <button onClick={() => setUnit((u) => (u === "imperial" ? "metric" : "imperial"))}
              style={{ background: "none", border: `1px solid ${C.line}`, color: C.paperDim, fontSize: 10, padding: "3px 7px", borderRadius: 4, cursor: "pointer" }}>
              {unit === "imperial" ? "use cm" : "use ft/in"}
            </button>
          </div>
        </div>
        {unit === "imperial" ? (
          <div style={{ display: "flex", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 10, color: C.paperDim, marginBottom: 2 }}>Feet</div>
              <input type="range" min="4" max="6" value={cmToFtIn(heightCm).feet}
                onChange={(e) => setHeightCm(clamp(ftInToCm(Number(e.target.value), cmToFtIn(heightCm).inches), 155, 205))}
                style={{ width: "100%", accentColor: C.rust }} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 10, color: C.paperDim, marginBottom: 2 }}>Inches</div>
              <input type="range" min="0" max="11" value={cmToFtIn(heightCm).inches}
                onChange={(e) => setHeightCm(clamp(ftInToCm(cmToFtIn(heightCm).feet, Number(e.target.value)), 155, 205))}
                style={{ width: "100%", accentColor: C.rust }} />
            </div>
          </div>
        ) : (
          <input type="range" min="155" max="205" value={Math.round(heightCm)} onChange={(e) => setHeightCm(Number(e.target.value))}
            style={{ width: "100%", accentColor: C.rust }} />
        )}
        <div style={{ fontSize: 10, color: C.paperDim, marginTop: 4, fontStyle: "italic" }}>Relative to ~5'9" (175cm) population average.</div>
      </div>

      {SELECTS.map((f) => (
        <div key={f.key} style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 13.5, color: C.paper, fontFamily: serif, display: "block", marginBottom: 6 }}>{f.label}</label>
          <select value={v[f.key]} onChange={(e) => upd(f.key, Number(e.target.value))}
            style={{ width: "100%", padding: "8px 10px", background: C.inkSoft, color: C.paper, border: `1px solid ${C.line}`, borderRadius: 6, fontSize: 13.5 }}>
            {f.options.map((o) => <option key={o.v} value={o.v}>{o.t}</option>)}
          </select>
        </div>
      ))}

      <div style={{ margin: "20px 0 8px", fontFamily: serif, fontSize: 15, color: C.paper }}>Initial attraction traits</div>
      {SLIDER_INITIAL.map((t) => <Slider key={t.key} trait={t} value={v[t.key]} onChange={(val) => upd(t.key, val)} />)}

      <div style={{ margin: "20px 0 8px", fontFamily: serif, fontSize: 15, color: C.paper }}>Long-term partner traits</div>
      {SLIDER_LONGTERM.map((t) => <Slider key={t.key} trait={t} value={v[t.key]} onChange={(val) => upd(t.key, val)} />)}

      <div style={{ marginTop: 24, background: C.inkSoft, border: `1px solid ${C.line}`, borderRadius: 10, padding: 18 }}>
        <div style={{ fontFamily: serif, fontSize: 15.5, color: C.paper, marginBottom: 10 }}>Where effort moves the score most</div>
        {gaps.map((g, i) => (
          <div key={g.label} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <div style={{ width: 20, height: 20, borderRadius: "50%", background: C.rust, color: C.paper, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontFamily: mono, flexShrink: 0 }}>{i + 1}</div>
            <div style={{ flex: 1 }}>
              <div style={{ color: C.paper, fontSize: 13 }}>{g.label}</div>
              <div style={{ height: 5, background: C.line, borderRadius: 3, marginTop: 3 }}>
                <div style={{ height: 5, width: `${(g.val / 10) * 100}%`, background: C.gold, borderRadius: 3 }} />
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

          <div style={{ fontFamily: serif, fontSize: 19, color: C.paper, marginBottom: 8 }}>See where the biggest gaps are?</div>
          <p style={{ color: C.paperDim, fontSize: 13, marginBottom: 16, lineHeight: 1.5 }}>
            The training program below is sequenced specifically around closing them — from calibrated confidence and body
            language through cold approach, digital presence, first dates, and long-term relationship security.
          </p>
          <button onClick={() => setView("program")} style={{
            background: C.rust, color: C.paper, border: "none", padding: "12px 28px", borderRadius: 8,
            fontSize: 14, fontFamily: serif, cursor: "pointer", letterSpacing: 0.5,
          }}>
            Start the Training Program →
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Site />);
</script>
</body>
